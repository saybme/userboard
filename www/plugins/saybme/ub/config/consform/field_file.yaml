name: Файл
description: Загрузка одного файла
icon: icon-file-o
fields:
    title:
        label: Название поля
        span: left
        type: text
    code:
        label: Код поля
        comment: Оставьте пустым — заполнится автоматически
        span: right
        type: text
    accept:
        label: Типы файлов
        comment: Например image/*, .pdf,.jpg
        span: left
        type: text
    max_size:
        label: Макс. размер, МБ
        span: right
        type: number
        default: 5
    comment:
        label: Комментарий
        span: full
        type: text
    is_required:
        label: Обязательное поле
        span: full
        type: checkbox
    span:
        label: Ширина
        span: auto
        type: dropdown
        default: full
        options:
            full: На всю ширину
            left: Левая колонка
            right: Правая колонка
