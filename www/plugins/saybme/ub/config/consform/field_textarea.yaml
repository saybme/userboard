name: Многострочный текст
description: Текстовая область
icon: icon-align-left
fields:
    title:
        label: Название поля
        span: left
        type: text
    code:
        label: Код поля
        comment: Оставьте пустым — заполнится автоматически
        span: right
        type: text
    placeholder:
        label: Подсказка в поле
        span: left
        type: text
    rows:
        label: Высота (строк)
        span: right
        type: number
        default: 4
    comment:
        label: Комментарий под полем
        span: full
        type: text
    is_required:
        label: Обязательное поле
        span: full
        type: checkbox
    span:
        label: Ширина
        span: auto
        type: dropdown
        default: full
        options:
            full: На всю ширину
            left: Левая колонка
            right: Правая колонка
