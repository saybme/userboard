name: Год
description: Выбор года
icon: icon-calendar-o
fields:
    title:
        label: Название поля
        span: left
        type: text
    code:
        label: Код поля
        comment: Оставьте пустым — заполнится автоматически
        span: right
        type: text
    year_from:
        label: Год с
        span: left
        type: number
        default: 1940
    year_to:
        label: Год по
        comment: Пусто — текущий год
        span: right
        type: number
    comment:
        label: Комментарий
        span: full
        type: text
    is_required:
        label: Обязательное поле
        span: full
        type: checkbox
    span:
        label: Ширина
        span: auto
        type: dropdown
        default: full
        options:
            full: На всю ширину
            left: Левая колонка
            right: Правая колонка
