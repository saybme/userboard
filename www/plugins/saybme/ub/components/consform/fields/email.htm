<label class="form-label" for="{{ field.code }}">
    {{ field.title }} {% if field.is_required %}<b class="text-red-1">*</b>{% endif %}
</label>
<input
    type="email"
    id="{{ field.code }}"
    name="{{ field.code }}"
    placeholder="{{ field.placeholder }}"
    class="input input-bordered w-full"
>
{% if field.comment %}<div class="text-xs text-gray-400 mt-1">{{ field.comment }}</div>{% endif %}
<div data-validate-for="{{ field.code }}" class="text-error text-xs"></div>
