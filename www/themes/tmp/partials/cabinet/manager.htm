<div class="py-8">

    <div class="flex flex-wrap items-center justify-between gap-4">
        <h1 class="table:text-txt-40 text-blue-2">
            {% if section == 'ads' %}Объявления{% else %}Заявки{% endif %}
        </h1>
        <a href="/api/auth/logout" class="btn btn-sm btn-warning">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                <path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 015.25 2h5.5A2.25 2.25 0 0113 4.25v2a.75.75 0 01-1.5 0v-2a.75.75 0 00-.75-.75h-5.5a.75.75 0 00-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 00.75-.75v-2a.75.75 0 011.5 0v2A2.25 2.25 0 0110.75 18h-5.5A2.25 2.25 0 013 15.75V4.25z" clip-rule="evenodd" />
                <path fill-rule="evenodd" d="M19 10a.75.75 0 00-.75-.75H8.704l1.048-.943a.75.75 0 10-1.004-1.114l-2.5 2.25a.75.75 0 000 1.114l2.5 2.25a.75.75 0 101.004-1.114l-1.048-.943h9.546A.75.75 0 0019 10z" clip-rule="evenodd" />
            </svg>
            Выход
        </a>
    </div>

    <div class="mt-6 flex flex-wrap gap-2">
        <a href="/cabinet" class="btn btn-sm {{ section == 'applications' ? 'btn-red text-white' : 'bg-white text-blue-2 border border-blue-2 hover:bg-blue-50' }}">
            Заявки
        </a>
        <a href="/cabinet/obyavleniya" class="btn btn-sm {{ section == 'ads' ? 'btn-red text-white' : 'bg-white text-blue-2 border border-blue-2 hover:bg-blue-50' }}">
            Объявления
        </a>
    </div>

    {% if section == 'ads' %}
        {% partial 'cabinet/manager-ads' announcements=announcements %}
    {% else %}
        {% partial 'cabinet/manager-applications' applications=applications %}
    {% endif %}

</div>
