{% framework extras %}
<script src="{{ ['assets/js/app.js'] | theme }}"></script>

<script>
window.authEmailCheckTimer = null;
window.authEmailCheckSeq = 0;

window.authIsEmail = function (value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || '').trim());
};

window.authRequestElement = function () {
    return document.getElementById('auth-form')
        || document.getElementById('btn-auth-open')
        || document.querySelector('[data-request="onModalOpen"]');
};

window.authSetEmailMode = function (exists, isManager) {
    var confirmWrap = document.getElementById('auth-email-confirm-wrap');
    var submitBtn = document.getElementById('auth-email-submit');
    var linkBtn = document.getElementById('auth-email-link');
    var emailBlock = document.getElementById('auth-mode-email');
    var emailFields = document.getElementById('auth-mode-email-fields');
    var passwordField = document.getElementById('m-email-password');
    var hint = document.getElementById('auth-mode-hint');

    if (!submitBtn) {
        return;
    }

    if (exists === true) {
        if (confirmWrap) {
            confirmWrap.style.display = 'none';
        }
        if (emailFields) {
            emailFields.style.display = '';
        }
        submitBtn.style.display = '';
        submitBtn.textContent = 'Войти';
        submitBtn.setAttribute('data-action', 'email_login');
        submitBtn.className = 'btn btn-red w-full';
        if (linkBtn) {
            linkBtn.style.display = isManager ? 'none' : '';
        }
        if (passwordField) {
            passwordField.setAttribute('autocomplete', 'current-password');
        }
        if (emailBlock) {
            emailBlock.style.display = '';
        }
        if (hint) {
            hint.style.display = 'none';
        }
        return;
    }

    if (exists === false) {
        if (confirmWrap) {
            confirmWrap.style.display = '';
        }
        if (emailFields) {
            emailFields.style.display = '';
        }
        submitBtn.style.display = '';
        submitBtn.textContent = 'Зарегистрироваться';
        submitBtn.setAttribute('data-action', 'email_register');
        submitBtn.className = 'btn btn-red w-full';
        if (linkBtn) {
            linkBtn.style.display = 'none';
        }
        if (passwordField) {
            passwordField.setAttribute('autocomplete', 'new-password');
        }
        if (emailBlock) {
            emailBlock.style.display = '';
        }
        if (hint) {
            hint.style.display = 'none';
        }
        return;
    }

    if (confirmWrap) {
        confirmWrap.style.display = 'none';
    }
    if (emailFields) {
        emailFields.style.display = 'none';
    }
    submitBtn.style.display = 'none';
    if (linkBtn) {
        linkBtn.style.display = 'none';
    }
    if (emailBlock) {
        emailBlock.style.display = 'none';
    }
    if (hint) {
        hint.style.display = '';
    }
};

window.authParseExists = function (data) {
    var value = data && data.exists;
    if (value === true || value === 1 || value === '1' || value === 'true') {
        return true;
    }
    if (value === false || value === 0 || value === '0' || value === 'false') {
        return false;
    }
    return null;
};

window.authApplyCheckResult = function (data) {
    window.authSetEmailMode(window.authParseExists(data), !!(data && data.is_manager));
};

window.authCheckEmailExists = function (value) {
    var seq = ++window.authEmailCheckSeq;
    var email = String(value || '').trim();

    if (!email) {
        window.authSetEmailMode(null);
        return;
    }

    // Пока сервер отвечает: неизвестный email → регистрация, не вход
    if (window.authIsEmail(email)) {
        window.authSetEmailMode(false);
    }

    var trigger = window.authRequestElement();
    var payload = { login: email, email: email };
    var done = function (data) {
        if (seq !== window.authEmailCheckSeq) {
            return;
        }
        window.authApplyCheckResult(data);
    };
    var fail = function () {
        if (seq !== window.authEmailCheckSeq) {
            return;
        }
        if (window.authIsEmail(email)) {
            window.authSetEmailMode(false);
        } else {
            window.authSetEmailMode(null);
        }
    };

    if (typeof oc !== 'undefined' && typeof oc.request === 'function' && trigger) {
        oc.request(trigger, 'onCheckAuthEmail', {
            data: payload,
            success: done,
            error: fail
        });
        return;
    }

    if (typeof oc !== 'undefined' && typeof oc.ajax === 'function') {
        oc.ajax('onCheckAuthEmail', {
            data: payload,
            success: done,
            error: fail
        });
        return;
    }

    if (window.jQuery && trigger && typeof jQuery(trigger).request === 'function') {
        jQuery(trigger).request('onCheckAuthEmail', {
            data: payload,
            success: done,
            error: fail
        });
    }
};

window.authDetectMode = function (input) {
    if (!input) {
        return;
    }

    var value = String(input.value || '').trim();
    var emailHidden = document.getElementById('auth-email');

    if (emailHidden) {
        emailHidden.value = value;
    }

    clearTimeout(window.authEmailCheckTimer);

    if (!value) {
        window.authSetEmailMode(null);
        return;
    }

    if (window.authIsEmail(value)) {
        window.authSetEmailMode(false);
    }

    window.authEmailCheckTimer = setTimeout(function () {
        window.authCheckEmailExists(value);
    }, 250);
};

window.authPrepareEmail = function (action) {
    var login = document.getElementById('auth-login');
    var emailHidden = document.getElementById('auth-email');
    var actionInput = document.getElementById('auth-action');
    var submitBtn = document.getElementById('auth-email-submit');
    var resolved = action || (submitBtn && submitBtn.getAttribute('data-action')) || '';

    if (login && emailHidden) {
        emailHidden.value = String(login.value || '').trim();
    }

    if (actionInput) {
        actionInput.value = resolved;
    }
};

window.authSubmit = function (action) {
    var form = document.getElementById('auth-form') || document.querySelector('#enter-form form');
    var submitBtn = document.getElementById('auth-email-submit');
    var resolved = action || (submitBtn && submitBtn.getAttribute('data-action')) || 'email_login';

    if (!form) {
        return;
    }

    window.authPrepareEmail(resolved);

    if (typeof oc !== 'undefined' && typeof oc.request === 'function') {
        oc.request(form, 'onAuth');
        return;
    }

    if (window.jQuery && typeof jQuery(form).request === 'function') {
        jQuery(form).request('onAuth');
        return;
    }

    form.request(resolved);
};

window.authInitForm = function () {
    var login = document.getElementById('auth-login');
    if (login && typeof window.authDetectMode === 'function') {
        window.authDetectMode(login);
    }
};

window.authCanSubmit = function () {
    var action = document.getElementById('auth-action');
    var submitBtn = document.getElementById('auth-email-submit');

    if (action && !action.value && submitBtn) {
        action.value = submitBtn.getAttribute('data-action') || 'email_login';
    }

    if (!action) {
        return true;
    }

    return Boolean(action.value);
};
</script>

<script>
    if (typeof window.numberCarousel === 'function') {
        window.numberCarousel();
    }
    if (typeof window.numberCarouselLenta === 'function') {
        window.numberCarouselLenta();
    }
    if (typeof window.numberCarouselVertical === 'function') {
        window.numberCarouselVertical();
    }
</script>
