<script src="{{ ['assets/js/app.js'] | theme }}"></script>

<script>
window.authEmailCheckTimer = null;
window.authEmailCheckSeq = 0;

window.authIsEmail = function (value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || '').trim());
};

window.authIsPhone = function (value) {
    var text = String(value || '').trim();
    if (!text || text.indexOf('@') !== -1) {
        return false;
    }
    var digits = text.replace(/\D+/g, '');
    return digits.length >= 10;
};

window.authSetEmailMode = function (exists) {
    var confirmWrap = document.getElementById('auth-email-confirm-wrap');
    var submitBtn = document.getElementById('auth-email-submit');
    var linkBtn = document.getElementById('auth-email-link');
    var emailBlock = document.getElementById('auth-mode-email');
    var passwordField = document.getElementById('m-email-password');

    if (!submitBtn) {
        return;
    }

    if (exists === true) {
        if (confirmWrap) {
            confirmWrap.style.display = 'none';
        }
        submitBtn.style.display = '';
        submitBtn.textContent = 'Войти';
        submitBtn.setAttribute('data-action', 'email_login');
        submitBtn.className = 'btn btn-red w-full';
        if (linkBtn) {
            linkBtn.style.display = '';
        }
        if (passwordField) {
            passwordField.setAttribute('autocomplete', 'current-password');
        }
        if (emailBlock) {
            emailBlock.style.display = '';
        }
        return;
    }

    if (exists === false) {
        if (confirmWrap) {
            confirmWrap.style.display = '';
        }
        submitBtn.style.display = '';
        submitBtn.textContent = 'Зарегистрироваться';
        submitBtn.setAttribute('data-action', 'email_register');
        submitBtn.className = 'btn btn-red w-full';
        if (linkBtn) {
            linkBtn.style.display = 'none';
        }
        if (passwordField) {
            passwordField.setAttribute('autocomplete', 'new-password');
        }
        if (emailBlock) {
            emailBlock.style.display = '';
        }
        return;
    }

    // ещё проверяем / невалидный email
    if (confirmWrap) {
        confirmWrap.style.display = 'none';
    }
    submitBtn.style.display = 'none';
    if (linkBtn) {
        linkBtn.style.display = 'none';
    }
    if (emailBlock) {
        emailBlock.style.display = 'none';
    }
};

window.authCheckEmailExists = function (email) {
    var seq = ++window.authEmailCheckSeq;

    if (!window.authIsEmail(email)) {
        window.authSetEmailMode(null);
        return;
    }

    var requestFn = null;
    if (typeof oc !== 'undefined' && typeof oc.ajax === 'function') {
        requestFn = function () {
            oc.ajax('onCheckAuthEmail', {
                data: { email: email },
                success: function (data) {
                    if (seq !== window.authEmailCheckSeq) {
                        return;
                    }
                    window.authSetEmailMode(data && data.exists === true ? true : (data && data.exists === false ? false : null));
                },
                error: function () {
                    if (seq !== window.authEmailCheckSeq) {
                        return;
                    }
                    window.authSetEmailMode(null);
                }
            });
        };
    } else if (window.jQuery && typeof jQuery('body').request === 'function') {
        requestFn = function () {
            jQuery('body').request('onCheckAuthEmail', {
                data: { email: email },
                success: function (data) {
                    if (seq !== window.authEmailCheckSeq) {
                        return;
                    }
                    window.authSetEmailMode(data && data.exists === true ? true : (data && data.exists === false ? false : null));
                }
            });
        };
    }

    if (requestFn) {
        requestFn();
    }
};

window.authDetectMode = function (input) {
    if (!input) {
        return;
    }

    var value = String(input.value || '').trim();
    var isEmail = window.authIsEmail(value);
    var isPhone = window.authIsPhone(value);
    var maybeEmail = value.indexOf('@') !== -1;
    var phoneBlock = document.getElementById('auth-mode-phone');
    var emailBlock = document.getElementById('auth-mode-email');
    var emailFields = document.getElementById('auth-mode-email-fields');
    var hint = document.getElementById('auth-mode-hint');
    var label = document.getElementById('auth-login-label');
    var phoneHidden = document.getElementById('auth-phone');
    var emailHidden = document.getElementById('auth-email');

    if (phoneHidden) {
        phoneHidden.value = isPhone ? value : '';
    }
    if (emailHidden) {
        emailHidden.value = (isEmail || maybeEmail) ? value : '';
    }

    if (label) {
        if (isEmail || maybeEmail) {
            label.textContent = 'Email';
        } else if (isPhone) {
            label.textContent = 'Номер телефона';
        } else {
            label.textContent = 'Телефон или email';
        }
    }

    if (phoneBlock) {
        phoneBlock.style.display = isPhone ? '' : 'none';
    }

    if (emailFields) {
        emailFields.style.display = (isEmail || maybeEmail) ? '' : 'none';
    }

    if (isEmail) {
        if (hint) {
            hint.style.display = 'none';
        }
        clearTimeout(window.authEmailCheckTimer);
        window.authEmailCheckTimer = setTimeout(function () {
            window.authCheckEmailExists(value);
        }, 350);
    } else {
        clearTimeout(window.authEmailCheckTimer);
        window.authSetEmailMode(null);
        if (emailBlock && !maybeEmail) {
            emailBlock.style.display = 'none';
        }
        if (hint) {
            hint.style.display = (!isPhone && !maybeEmail) ? '' : 'none';
        }
    }
};

window.authPreparePhone = function (method) {
    var login = document.getElementById('auth-login');
    var phoneHidden = document.getElementById('auth-phone');
    var emailHidden = document.getElementById('auth-email');

    if (login && phoneHidden) {
        phoneHidden.value = String(login.value || '').trim();
    }
    if (emailHidden) {
        emailHidden.value = '';
    }

    document.getElementById('auth-action').value = '';
    document.getElementById('auth-step').value = '2';
    document.getElementById('auth-verify-method').value = method;
};

window.authPrepareEmail = function (action) {
    var login = document.getElementById('auth-login');
    var phoneHidden = document.getElementById('auth-phone');
    var emailHidden = document.getElementById('auth-email');

    if (login && emailHidden) {
        emailHidden.value = String(login.value || '').trim();
    }
    if (phoneHidden) {
        phoneHidden.value = '';
    }

    document.getElementById('auth-verify-method').value = '';
    document.getElementById('auth-step').value = '';
    document.getElementById('auth-action').value = action;
};

window.authCanSubmit = function () {
    var action = document.getElementById('auth-action');
    var method = document.getElementById('auth-verify-method');

    // Шаги 2/3 без этих полей — обычная отправка
    if (!action && !method) {
        return true;
    }

    if ((action && action.value) || (method && method.value)) {
        return true;
    }

    return false;
};
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('btn-auth-open');
    if (btn) {
        btn.click();
    }
});
</script>
