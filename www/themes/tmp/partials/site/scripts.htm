{% framework extras %}
<script src="{{ ['assets/js/app.js'] | theme }}"></script>

<script>
window.authEmailCheckTimer = null;
window.authEmailCheckSeq = 0;

window.authIsEmail = function (value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || '').trim());
};

window.authSetEmailMode = function (exists, isManager) {
    var confirmWrap = document.getElementById('auth-email-confirm-wrap');
    var submitBtn = document.getElementById('auth-email-submit');
    var linkBtn = document.getElementById('auth-email-link');
    var emailBlock = document.getElementById('auth-mode-email');
    var emailFields = document.getElementById('auth-mode-email-fields');
    var passwordField = document.getElementById('m-email-password');
    var hint = document.getElementById('auth-mode-hint');

    if (!submitBtn) {
        return;
    }

    if (exists === true) {
        if (confirmWrap) {
            confirmWrap.style.display = 'none';
        }
        if (emailFields) {
            emailFields.style.display = '';
        }
        submitBtn.style.display = '';
        submitBtn.textContent = 'Войти';
        submitBtn.setAttribute('data-action', 'email_login');
        submitBtn.className = 'btn btn-red w-full';
        if (linkBtn) {
            linkBtn.style.display = isManager ? 'none' : '';
        }
        if (passwordField) {
            passwordField.setAttribute('autocomplete', 'current-password');
        }
        if (emailBlock) {
            emailBlock.style.display = '';
        }
        if (hint) {
            hint.style.display = 'none';
        }
        return;
    }

    if (exists === false) {
        if (confirmWrap) {
            confirmWrap.style.display = '';
        }
        if (emailFields) {
            emailFields.style.display = '';
        }
        submitBtn.style.display = '';
        submitBtn.textContent = 'Зарегистрироваться';
        submitBtn.setAttribute('data-action', 'email_register');
        submitBtn.className = 'btn btn-red w-full';
        if (linkBtn) {
            linkBtn.style.display = 'none';
        }
        if (passwordField) {
            passwordField.setAttribute('autocomplete', 'new-password');
        }
        if (emailBlock) {
            emailBlock.style.display = '';
        }
        if (hint) {
            hint.style.display = 'none';
        }
        return;
    }

    if (confirmWrap) {
        confirmWrap.style.display = 'none';
    }
    if (emailFields) {
        emailFields.style.display = 'none';
    }
    submitBtn.style.display = 'none';
    if (linkBtn) {
        linkBtn.style.display = 'none';
    }
    if (emailBlock) {
        emailBlock.style.display = 'none';
    }
    if (hint) {
        hint.style.display = '';
    }
};

window.authApplyCheckResult = function (data) {
    var exists = data && data.exists === true ? true : (data && data.exists === false ? false : null);
    var isManager = !!(data && data.is_manager);
    window.authSetEmailMode(exists, isManager);
};

window.authCheckEmailExists = function (value) {
    var seq = ++window.authEmailCheckSeq;

    if (!value || String(value).trim().length < 2) {
        window.authSetEmailMode(null);
        return;
    }

    var requestFn = null;
    if (typeof oc !== 'undefined' && typeof oc.ajax === 'function') {
        requestFn = function () {
            oc.ajax('onCheckAuthEmail', {
                data: { login: value, email: value },
                success: function (data) {
                    if (seq !== window.authEmailCheckSeq) {
                        return;
                    }
                    window.authApplyCheckResult(data);
                },
                error: function () {
                    if (seq !== window.authEmailCheckSeq) {
                        return;
                    }
                    window.authSetEmailMode(null);
                }
            });
        };
    } else if (window.jQuery && typeof jQuery('body').request === 'function') {
        requestFn = function () {
            jQuery('body').request('onCheckAuthEmail', {
                data: { login: value, email: value },
                success: function (data) {
                    if (seq !== window.authEmailCheckSeq) {
                        return;
                    }
                    window.authApplyCheckResult(data);
                }
            });
        };
    }

            }

    }
};

window.authDetectMode = function (input) {
    if (!input) {
        return;
    }

    var value = String(input.value || '').trim();
    var emailHidden = document.getElementById('auth-email');

    if (emailHidden) {
        emailHidden.value = value;
    }

    clearTimeout(window.authEmailCheckTimer);

    if (value.length < 2) {
        window.authSetEmailMode(null);
        return;
    }

    window.authEmailCheckTimer = setTimeout(function () {
        window.authCheckEmailExists(value);
    }, 350);
};

window.authPrepareEmail = function (action) {
    var login = document.getElementById('auth-login');
    var emailHidden = document.getElementById('auth-email');
    var actionInput = document.getElementById('auth-action');

    if (login && emailHidden) {
        emailHidden.value = String(login.value || '').trim();
    }

    document.getElementById('auth-action').value = action;
};

window.authCanSubmit = function () {
    var action = document.getElementById('auth-action');

    if (!action) {
        return true;
    }

    return Boolean(action.value);
};
</script>
