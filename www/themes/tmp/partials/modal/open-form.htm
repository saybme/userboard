<div class="" id="enter-form">

    <div class="p-5">

        <h3 class="text-txt-30 text-blue-2 font-bebas">Вход / регистрация</h3>

        <form action="" data-request="onAuth" class="block w-full mt-3" data-request-validate id="auth-form" onsubmit="return authCanSubmit()">
            <div id="open-result">
                {% partial 'modal/form-inputs'
                    step=step|default(1)
                    auth_error=auth_error
                    email_link_sent_to=email_link_sent_to
                %}
            </div>
        </form>

    </div>

</div>
